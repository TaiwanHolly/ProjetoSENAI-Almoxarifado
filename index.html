
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONAX - Controle de Almoxarifado</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/Sonax.png">
</head>

<body>

    <main class="main-container">

        <!-- LADO ESQUERDO: LOGIN -->
        <section class="leftbody">

            <div class="login-container">

                <h1>Bem-vindo ao SONAX</h1>

                <p>Controle de Almoxarifado</p>

                <form action="login.php" method="POST">

                    <div class="input-group">
                        <input
                            type="text"
                            name="username"
                            placeholder="Usuário"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            placeholder="Senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit">Entrar</button>

                </form>

            </div>

            <div class="footer">
                <p>© 2026 SONAX SENAI. Todos os direitos reservados.</p>
            </div>

        </section>


        <!-- LADO DIREITO: IDENTIDADE VISUAL -->
        <section class="rightbody">

            <div class="brand-container">

                <img src="img/Sonax.png" alt="Logo SONAX" class="logo">

                <h2>SONAX</h2>

                <p>
                    Sistema de Controle de Almoxarifado
                </p>

                <div class="brand-description">
                    <p>
                        Organização, controle e eficiência
                        para a gestão do seu almoxarifado.
                    </p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
