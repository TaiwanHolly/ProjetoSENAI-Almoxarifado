<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SONAX - Cadastro</title>

    <link rel="stylesheet" href="css/styleLogin.css" />
    <link rel="icon" type="image/png" href="img/Sonax.png" />
  </head>

  <body>
    <main>
      <!-- LADO ESQUERDO: LOGIN -->
      <section class="login">
        <div>
          <h1>Bem-vindo à SONAX</h1>

          <p>Controle de Almoxarifado</p>
          <p>Faça o cadastro</p>

          <form>
            <input
              type="text"
              id="nome-usuario"
              name="username"
              placeholder="Nome do Usuário"
              autocomplete="username"
            />

            <input
              type="text"
              id="usuario"
              name="username"
              placeholder="Usuário (Login)"
              autocomplete="username"
            />

            <input
              type="password"
              id="senha"
              name="password"
              placeholder="Senha"
              autocomplete="current-password"
            />

            <select id="tipo" title="role">
                <option value="2">Professor</option>
                <option value="3">Cordenador</option>
            </select>

            <button id="btnLogin" onclick="cadastrar()">
              Entrar
            </button>
          </form>
          <a style="color: gray; cursor: pointer" onclick="pageswap()">Possui uma conta? <b>faça Login</b></a>
        </div>



        <footer>
          <p>© 2026 SONAX SENAI. Todos os direitos reservados.</p>
        </footer>
      </section>

      <!-- LADO DIREITO: IDENTIDADE VISUAL -->
      <section class="marca">
        <div>
          <img src="img/Sonax.png" alt="Logo SONAX" />

          <h2>SONAX</h2>

          <p>Sistema de Controle de Almoxarifado</p>
          <p>
            <b><i>Analise, adapte e alcance.</i></b>
          </p>
        </div>
      </section>
    </main>

   <script src="js/CadastroJS.js"></script>

  </body>
</html>
