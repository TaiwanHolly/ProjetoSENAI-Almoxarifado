
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONAX - Controle de Almoxarifado</title>

    <link rel="stylesheet" href="css/styleLogin.css">
    <link rel="icon" type="image/png" href="img/Sonax.png">
</head>
<body>

    <main class="main-container">

        <!--ESQUERDA: LOGIN -->
        <section class="leftbody">

            <div class="login-container">

                <h1>Bem-vindo à SONAX</h1>

                <p>Controle de Almoxarifado</p>
                <p>Faça login para acessar o sistema <br> (atualmente só de enfeite)</p>

                <form action="login.php" method="POST" id="loginForm">

                    <div class="input-group">
                        <input
                            type="text"
                            name="username"
                            placeholder="Usuário"
                            autocomplete="username"
                            required
                            id="ipt-usuario"
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            placeholder="Senha"
                            autocomplete="current-password"
                            required
                            id="ipt-senha"
                        >
                    </div>

                    <button type="submit" id="btnLogin" onclick="logar()">Entrar</button>
                    
                    

                </form>

            </div>

            <div class="footer">
                <p>© 2026 SONAX SENAI. Todos os direitos reservados.</p>
            </div>

        </section>


        <!--DIREITA: AREA LIVRE ONDE FICA ENFEITES -->
        <section class="rightbody">

            <div class="brand-container">

                <img src="img/Sonax.png" alt="Logo SONAX" class="logo" id="logo">

                <h2>SONAX</h2>

                <p>
                    Sistema de Controle de Almoxarifado
                </p>

                <div class="brand-description">
                    <p>
                        <b><i>Analise, adapte e alcance.</i></b>
                    </p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
