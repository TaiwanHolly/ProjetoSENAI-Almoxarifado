<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONAX - Controle de Almoxarifado</title>

    <link rel="stylesheet" href="css/styleLogin.css">
    <link rel="icon" type="image/png" href="img/Sonax.png">
</head>

<body>

    <main>

        <!-- LADO ESQUERDO: LOGIN -->
        <section class="login">

            <div>
                <h1>Bem-vindo à SONAX</h1>

                <p>Controle de Almoxarifado</p>
                <p>Faça login para acessar o Sistema</p>

                <form>
                    <input type="text" id="ipt-usuario" name="username"
                        placeholder="Usuário" autocomplete="username" required>

                    <input type="password" id="ipt-senha" name="password"
                        placeholder="Senha" autocomplete="current-password" required>

                    <button type="submit" id="btnLogin" onclick="logar()">Entrar</button>
                </form>
            </div>

            <footer>
                <p>© 2026 SONAX SENAI. Todos os direitos reservados.</p>
            </footer>

        </section>

        <!-- LADO DIREITO: IDENTIDADE VISUAL -->
        <section class="marca">

            <div>
                <img src="img/Sonax.png" alt="Logo SONAX">

                <h2>SONAX</h2>

                <p>Sistema de Controle de Almoxarifado</p>
                <p><b><i>Analise, adapte e alcance.</i></b></p>
            </div>

        </section>

    </main>

    <script src="js/LoginJS.js"></script>

</body>
</html>
